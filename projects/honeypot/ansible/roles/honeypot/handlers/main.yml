---
- name: Restart SSH
  ansible.builtin.systemd:
    name: sshd
    state: restarted
    daemon_reload: yes

- name: Restart fail2ban
  ansible.builtin.systemd:
    name: fail2ban
    state: restarted

- name: Restart cowrie
  ansible.builtin.systemd:
    name: cowrie
    state: restarted
    enabled: yes
    daemon_reload: yes

- name: Restart cowrie-forwarder
  ansible.builtin.systemd:
    name: cowrie-forwarder
    state: restarted
    enabled: yes
    daemon_reload: yes
