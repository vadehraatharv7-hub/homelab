---
# Baseline for every VM: updates, time, SSH, brute-force protection, kernel hardening.

- name: Refuse to run on anything but Ubuntu 22.04
  ansible.builtin.assert:
    that:
      - ansible_distribution == "Ubuntu"
      - ansible_distribution_version == "22.04"
    fail_msg: "These roles are written for Ubuntu 22.04 (found {{ ansible_distribution }} {{ ansible_distribution_version }})."

- name: Install baseline packages
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Apply pending package updates
  ansible.builtin.apt:
    upgrade: dist
  when: common_upgrade_packages

- name: Check whether a reboot is needed
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: reboot_required

- name: Reboot to finish the updates
  ansible.builtin.reboot:
    reboot_timeout: 600
  when: common_reboot_if_required and reboot_required.stat.exists

- name: Run the QEMU guest agent (Proxmox shows addresses and can shut the VM down cleanly)
  ansible.builtin.systemd:
    name: qemu-guest-agent
    state: started
  when: ansible_virtualization_type | default('') == 'kvm'

# ---- time
- name: Set the time zone
  community.general.timezone:
    name: "{{ common_timezone }}"

- name: Keep the clock synchronised
  ansible.builtin.systemd:
    name: systemd-timesyncd
    enabled: true
    state: started

# ---- SSH
- name: Harden the SSH daemon
  ansible.builtin.template:
    src: sshd-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/10-hardening.conf
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Reload SSH

# ---- brute-force protection
- name: Protect SSH with fail2ban
  ansible.builtin.template:
    src: fail2ban-sshd.local.j2
    dest: /etc/fail2ban/jail.d/10-sshd-homelab.local
    owner: root
    group: root
    mode: "0644"
  notify: Restart fail2ban

- name: Start fail2ban
  ansible.builtin.systemd:
    name: fail2ban
    enabled: true
    state: started

# ---- unattended security updates
- name: Install security updates automatically
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      APT::Periodic::AutocleanInterval "7";

# ---- kernel
- name: Apply kernel hardening settings
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/90-homelab-hardening.conf
    sysctl_set: true
    reload: true
    state: present
  loop: "{{ common_sysctl | dict2items }}"
